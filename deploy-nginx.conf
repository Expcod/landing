server {
    server_name landing.novacode.uz;
    root /var/www/landing.novacode.uz;
    index index.html;
    client_max_body_size 200M;
    location /media/ { alias /var/www/landing-back/media/; expires 7d; }
    location /static/ { alias /var/www/landing-back/static/; expires 7d; }
    location ~ ^/(api|admin)/ {
        proxy_pass http://127.0.0.1:8040;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /assets/ { expires 7d; add_header Cache-Control "public"; }
    location / { try_files $uri $uri/ /index.html; }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/landing.novacode.uz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/landing.novacode.uz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = landing.novacode.uz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name landing.novacode.uz;
    return 404; # managed by Certbot


}