{% extends "panel/base.html" %}
{% block title %}Паролни ўзгартириш{% endblock %}
{% block content %}
<div class="page-head"><div><h1>Паролни ўзгартириш</h1><p>Янги парол камида 8 белги ва жуда оддий бўлмасин.</p></div></div>
<div class="form-wrap" style="max-width:460px">
  <form method="post" class="card card-pad">
    {% csrf_token %}
    {% for f in form %}
    <div class="field {% if f.errors %}has-err{% endif %}"><label for="{{ f.id_for_label }}">{% if f.name == 'old_password' %}Ҳозирги парол{% elif f.name == 'new_password1' %}Янги парол{% else %}Янги паролни қайта киритинг{% endif %}</label>{{ f }}
      {% for e in f.errors %}<span class="err">{{ e }}</span>{% endfor %}</div>
    {% endfor %}
    <button class="btn btn-primary">Паролни ўзгартириш</button>
  </form>
</div>
{% endblock %}
